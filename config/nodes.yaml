nodes:
  # Three combined controlplane+worker nodes. talosctl gen config adds the
  # control-plane NoSchedule taint by default; the controlplane patch removes
  # it (see ADR-010) so these nodes stay schedulable. One data disk per node
  # for the future Rook-Ceph OSDs.
  - name: talos-node-01
    role: controlplane
    ip: 192.168.231.11
    mac: "52:54:00:23:10:11"
    vcpus: 4
    memory_mib: 8192
    os_disk_gib: 40
    data_disk_gib: 20

  - name: talos-node-02
    role: controlplane
    ip: 192.168.231.12
    mac: "52:54:00:23:10:12"
    vcpus: 4
    memory_mib: 8192
    os_disk_gib: 40
    data_disk_gib: 20

  - name: talos-node-03
    role: controlplane
    ip: 192.168.231.13
    mac: "52:54:00:23:10:13"
    vcpus: 4
    memory_mib: 8192
    os_disk_gib: 40
    data_disk_gib: 20
