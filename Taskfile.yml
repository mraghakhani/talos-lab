version: '3'

dotenv:
  - config/lab.local.env
  - config/lab.env

silent: true

tasks:
  default:
    desc: List available lab tasks
    cmds:
      - |
        if command -v task >/dev/null 2>&1; then
          task --list
        else
          go-task --list
        fi

  bootstrap:
    desc: Install host dependencies, then validate the virtualization host
    cmds:
      - ./scripts/00-install-host-deps.sh
      - task: host:check

  host:install:
    desc: Install CachyOS/Arch QEMU/KVM/libvirt dependencies
    platforms: [linux/amd64]
    cmds:
      - ./scripts/00-install-host-deps.sh

  host:check:
    desc: Verify CPU virtualization, KVM, QEMU, libvirt and lab tooling
    platforms: [linux/amd64]
    cmds:
      - ./scripts/01-host-check.sh

  cluster:old:discover:
    desc: Inspect a previous talosctl-managed QEMU cluster without changing it
    cmds:
      - ./scripts/02-old-cluster-discover.sh

  cluster:old:destroy:
    desc: Destroy only the configured previous talosctl-managed QEMU cluster
    preconditions:
      - sh: test -n "${OLD_CLUSTER_NAME:-}"
        msg: OLD_CLUSTER_NAME must be set in config/lab.env
    cmds:
      - ./scripts/03-destroy-old-qemu-cluster.sh

  proxy:check:host:
    desc: Verify the HTTP CONNECT proxy via host loopback
    cmds:
      - ./scripts/04-proxy-check-host.sh

  proxy:check:lab:
    desc: Verify the proxy is reachable on the libvirt gateway address
    cmds:
      - ./scripts/08-proxy-check-lab.sh

  network:render:
    desc: Render the libvirt network XML from config/lab.env
    cmds:
      - ./scripts/05-network-render.sh

  network:up:
    desc: Define, autostart and start the deterministic libvirt NAT network
    cmds:
      - task: host:check
      - task: network:render
      - ./scripts/06-network-up.sh

  network:status:
    desc: Show libvirt network state, bridge and DHCP leases
    cmds:
      - ./scripts/07-network-status.sh

  network:destroy:
    desc: Stop and undefine only the Talos lab network
    cmds:
      - ./scripts/09-network-destroy.sh

  network:recreate:
    desc: Recreate the lab network from its rendered definition
    cmds:
      - task: network:destroy
      - task: network:render
      - task: network:up

  storage:render:
    desc: Render the dedicated libvirt storage-pool definition
    cmds:
      - ./scripts/10-storage-render.sh

  storage:up:
    desc: Define and start the dedicated libvirt storage pool
    cmds:
      - task: storage:render
      - ./scripts/11-storage-up.sh

  storage:status:
    desc: Show pool information and volumes
    cmds:
      - virsh -c "$LIBVIRT_URI" pool-info "$LIBVIRT_POOL"
      - virsh -c "$LIBVIRT_URI" vol-list "$LIBVIRT_POOL"

  storage:destroy:
    desc: Undefine the dedicated lab storage pool after VMs are gone
    cmds:
      - ./scripts/16-storage-destroy.sh

  image:download:
    desc: Download pinned Talos ISO through proxy and verify official SHA-256
    cmds:
      - task: proxy:check:host
      - task: storage:up
      - ./scripts/12-talos-image-download.sh

  image:status:
    desc: Show pinned Talos ISO cache, checksum and libvirt-pool status
    cmds:
      - ./scripts/17-image-status.sh

  vm:plan:
    desc: Print and validate the desired six-VM topology without creating domains
    cmds:
      - ./scripts/18-vm-plan.sh

  vm:create:
    desc: Create all six Talos VMs from config/nodes.yaml
    cmds:
      - task: network:up
      - task: proxy:check:lab
      - task: image:download
      - task: vm:plan
      - ./scripts/13-vms-create.sh
      - task: vm:status

  vm:status:
    desc: Show desired nodes, VM states and DHCP leases
    cmds:
      - ./scripts/14-vms-status.sh
  vm:start:
    desc: Start all lab VMs idempotently
    cmds:
      - ./scripts/34-vms-start.sh
  vm:destroy:
    desc: Destroy only VMs and disks declared in config/nodes.yaml
    cmds:
      - ./scripts/15-vms-destroy.sh

  infra:up:
    desc: Bring up network, storage, pinned Talos image and all six VMs
    cmds:
      - task: vm:create

  infra:status:
    desc: Show network, storage and VM state
    cmds:
      - task: network:status
      - task: storage:status
      - task: vm:status

  infra:destroy:
    desc: Destroy VMs, storage pool and network; preserve downloaded cache
    cmds:
      - task: vm:destroy
      - task: storage:destroy
      - task: network:destroy

  preflight:
    desc: Run non-destructive host/proxy checks before provisioning
    cmds:
      - task: host:check
      - task: proxy:check:host

  talos:render:
    desc: Render committed Talos patch templates and per-node network documents
    cmds:
      - ./scripts/24-talos-render-patches.sh

  talos:maintenance:check:
    desc: Verify all six ISO-booted nodes are reachable in maintenance mode and expose expected disks
    cmds:
      - ./scripts/25-talos-maintenance-check.sh

  talos:generate:
    desc: Generate/reuse cluster secrets and render six node-specific Talos machine configs
    cmds:
      - task: talos:render
      - ./scripts/26-talos-generate.sh

  talos:validate:
    desc: Strictly validate generated Talos configs and verify sensitive output stays gitignored
    cmds:
      - task: talos:generate
      - ./scripts/27-talos-validate.sh

  talos:apply:
    desc: Install/configure Talos on all six maintenance-mode VMs using generated machine configs
    cmds:
      - task: talos:maintenance:check
      - task: talos:validate
      - ./scripts/28-talos-apply.sh

  talos:secure:check:
    desc: Verify all installed nodes have rebooted and are reachable through authenticated Talos API
    cmds:
      - ./scripts/29-talos-secure-check.sh

  talos:bootstrap:
    desc: Bootstrap etcd/Kubernetes exactly once from the first control-plane node
    cmds:
      - task: talos:secure:check
      - ./scripts/30-talos-bootstrap.sh

  talos:kubeconfig:
    desc: Retrieve a standalone admin kubeconfig into the gitignored generated directory
    cmds:
      - ./scripts/31-talos-kubeconfig.sh

  talos:status:
    desc: Show Talos membership, etcd membership and Kubernetes node registration
    cmds:
      - ./scripts/32-talos-status.sh

  vm:detach-iso:
    desc: Detach Talos installation ISO from all VM definitions after successful installation
    cmds:
      - ./scripts/33-vms-detach-iso.sh

  tools:install:
    desc: Install workstation Kubernetes/GitOps/security CLI tools from Arch repositories
    cmds:
      - task: host:install
      - ./scripts/19-tools-install.sh

  tools:check:
    desc: Verify workstation CLI tools and print desired/installed versions
    cmds:
      - ./scripts/20-tools-check.sh

  repo:secrets:check:
    desc: Verify sensitive/generated paths are covered by gitignore
    preconditions:
      - sh: git rev-parse --is-inside-work-tree >/dev/null 2>&1
        msg: This task must run inside a Git worktree
    cmds:
      - ./scripts/21-repo-secret-ignore-check.sh

  repo:check:
    desc: Run shell, YAML, Actions, Taskfile and secret-leak validation
    cmds:
      - ./scripts/22-repo-check.sh

  git:status:
    desc: Show Git branch, working tree and configured remotes
    preconditions:
      - sh: git rev-parse --is-inside-work-tree >/dev/null 2>&1
        msg: This task must run inside a Git worktree
    cmds:
      - git status --short --branch
      - echo
      - git remote -v

  repo:hooks:install:
    desc: Configure this clone to use the committed Git hooks
    preconditions:
      - sh: git rev-parse --is-inside-work-tree >/dev/null 2>&1
        msg: This task must run inside a Git worktree
    cmds:
      - git config core.hooksPath .githooks
      - echo "Installed repository hooks via core.hooksPath=.githooks"

  repo:hooks:status:
    desc: Show the Git hooks path used by this clone
    cmds:
      - 'echo "core.hooksPath=$$(git config --get core.hooksPath || echo default)"'

  repo:migrate-layout:
    desc: Remove known obsolete files/directories left behind by archive overlays
    cmds:
      - ./scripts/23-repo-migrate-layout.sh

  talos:images:prepull:
    desc: Pre-pull pinned Talos/Kubernetes images on nodes with retries
    cmds:
      - ./scripts/35-talos-images-prepull.sh

  vm:stop:force:
    desc: HARD power off all lab VMs immediately; preserve definitions and disks
    cmds:
      - ./scripts/36-vms-force-off.sh

  cilium:images:prepull:
    desc: Pre-pull pinned Cilium chart images on all Talos nodes
    cmds:
      - ./scripts/37-cilium-images-prepull.sh

  cilium:install:
    desc: Install or upgrade pinned Cilium with Talos/KubePrism settings
    cmds:
      - ./scripts/38-cilium-install.sh

  cilium:status:
    desc: Wait for Cilium health and verify all Kubernetes nodes are Ready
    cmds:
      - ./scripts/39-cilium-status.sh

  cilium:verify:
    desc: Run the Cilium connectivity test suite
    cmds:
      - ./scripts/40-cilium-verify.sh
