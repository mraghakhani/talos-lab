name: validate

"on":
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history for secret scanning
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'

      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-pip
          python3 -m pip install --break-system-packages 'yamllint==1.38.0'
          go install github.com/go-task/task/v3/cmd/task@v3.53.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/gitleaks/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate repository
        shell: bash
        run: task repo:check
